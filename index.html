<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1b1b1b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Budget Tracker" />
  <title>Budget Tracker</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/styles.css?v=9" />
</head>
<body>
  <div class="nav-scrim" id="nav-scrim"></div>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2Zm1 15h-2v-2h2Zm1.07-7.75-.9.92A1.74 1.74 0 0 0 12.5 12H11v-.5a1.75 1.75 0 0 1 .51-1.24l1.24-1.26a1 1 0 1 0-1.42-1.42l-.5.5-1.41-1.42.5-.5a3 3 0 1 1 4.24 4.24Z"/></svg>
        </div>
        <div>
          <div class="brand-name">Budget Tracker</div>
          <div class="brand-sub">Personal finance</div>
        </div>
      </div>
      <nav class="nav">
        <button class="nav-btn active" data-page="dashboard">Dashboard</button>
        <button class="nav-btn" data-page="accounts">Accounts</button>
        <button class="nav-btn" data-page="transactions">Transactions</button>
        <button class="nav-btn" data-page="income">Income</button>
        <button class="nav-btn" data-page="debts">Debts &amp; Loans</button>
        <button class="nav-btn" data-page="budgets">Budgets</button>
        <button class="nav-btn" data-page="goals">Savings Goals</button>
        <button class="nav-btn" data-page="settings">Settings</button>
      </nav>
      <div class="sidebar-foot">
        <div class="balance-chip">
          <span>Spending cash</span>
          <strong id="sidebar-balance">$0.00</strong>
          <span class="chip-sub">Savings <strong id="sidebar-savings">$0.00</strong></span>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="page-title">Dashboard</h1>
          <p id="page-subtitle" class="muted">Your money at a glance</p>
        </div>
        <div class="topbar-actions">
          <button class="btn ghost menu-btn" id="menu-toggle" type="button">Menu</button>
          <button class="btn ghost" id="theme-toggle" type="button">Light mode</button>
          <button class="btn primary" id="quick-add" type="button">Add transaction</button>
        </div>
      </header>

      <section id="page-dashboard" class="page active"></section>
      <section id="page-accounts" class="page"></section>
      <section id="page-transactions" class="page"></section>
      <section id="page-income" class="page"></section>
      <section id="page-debts" class="page"></section>
      <section id="page-budgets" class="page"></section>
      <section id="page-goals" class="page"></section>
      <section id="page-settings" class="page"></section>
    </main>
  </div>

  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <h2 id="modal-title">Dialog</h2>
        <button class="icon-btn" id="modal-close" type="button" aria-label="Close" onclick="closeAppModal()">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-foot" id="modal-foot"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script>
    function closeAppModal() {
      var backdrop = document.getElementById("modal-backdrop");
      if (!backdrop) return;
      backdrop.classList.remove("is-open");
      backdrop.hidden = true;
    }
  </script>
  <script src="js/storage.js?v=9"></script>
  <script src="js/calc.js?v=9"></script>
  <script src="js/csv.js?v=9"></script>
  <script src="js/app.js?v=9"></script>
  <script>
    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    }
  </script>
</body>
</html>
